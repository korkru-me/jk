<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img" aria-label="แผนผังวงจรไฟฟ้าอย่างง่าย">
  <rect width="400" height="260" fill="#ffffff"/>
  <g fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round">
    <!-- top wire, broken at the switch -->
    <path d="M70 60 H185"/>
    <path d="M225 60 H330"/>
    <!-- left wire, broken at the battery -->
    <path d="M70 60 V122"/>
    <path d="M70 138 V200"/>
    <!-- right wire, broken at the lamp -->
    <path d="M330 60 V112"/>
    <path d="M330 148 V200"/>
    <!-- bottom wire, broken at the ammeter -->
    <path d="M70 200 H184"/>
    <path d="M216 200 H330"/>
    <!-- battery: long plate is the positive terminal -->
    <path d="M52 122 H88"/>
    <path d="M60 138 H80"/>
    <!-- switch: open, hinged on the left contact -->
    <path d="M185 60 L220 42"/>
    <!-- lamp -->
    <circle cx="330" cy="130" r="18"/>
    <path d="M317 117 L343 143"/>
    <path d="M343 117 L317 143"/>
    <!-- ammeter -->
    <circle cx="200" cy="200" r="16"/>
  </g>
  <circle cx="185" cy="60" r="3.5" fill="#334155"/>
  <circle cx="225" cy="60" r="3.5" fill="#334155"/>
  <text x="200" y="206" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#334155" text-anchor="middle">A</text>
</svg>
